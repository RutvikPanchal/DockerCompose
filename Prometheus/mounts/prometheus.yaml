scrape_configs:
  - job_name: 'ibm-metrics'
    scrape_interval: 2s
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:9443']
    tls_config:
      insecure_skip_verify: true
  - job_name: 'kogito-app'
    scrape_interval: 2s
    metrics_path: /q/metrics
    static_configs:
      - targets: ['host.docker.internal:8080']
  - job_name: 'kogito-springboot-app'
    scrape_interval: 2s
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8080']