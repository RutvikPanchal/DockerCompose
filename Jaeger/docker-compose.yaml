version: '3'
services:
  jaeger:
    image: jaegertracing/all-in-one:1.6.0
    container_name: jaeger
    ports:
      - "5775:5775"   #	UDP	agent	accept zipkin.thrift over compact thrift protocol
      - "6831:6831"   #	UDP	agent	accept jaeger.thrift over compact thrift protocol
      - "6832:6832"   #	UDP	agent	accept jaeger.thrift over binary thrift protocol
      - "5778:5778"   #	HTTP	agent	serve configs
      - "16686:16686" #	HTTP	query	serve frontend
      - "14268:14268" #	HTTP	collector	accept jaeger.thrift directly from clients
      - "9411:9411"   #	HTTP	collector	Zipkin compatible endpoint
    environment:
      COLLECTOR_ZIPKIN_HTTP_PORT: 9411
      COLLECTOR_OTLP_ENABLED: true
    networks:
      - master
  hotrod:
    image: jaegertracing/example-hotrod:1.6.0
    container_name: hotrod
    ports:
      - "8088:8080"
      - "8089:8083"
    command: ["all"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:6831
    depends_on:
      - jaeger
    networks:
      - master
networks:
  master:
    external: true